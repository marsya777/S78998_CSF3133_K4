<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock, Paper, Scissors</title>
  <!-- Link to external style sheet-->
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- a header with the game title and a short introduction-->
  <header>
    <h1>Rock, Paper, Scissors</h1>
    <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
  </header>

  <main>
    <!-- a player section with a Name text input and a Start Game button -->
    <section id="playerSection">
      <label for="playerName">Your name:</label>
      <input type="text" id="playerName" placeholder="Type your name">
      <button onclick="startGame()">Start Game</button>
      <p id="welcome"></p>
    </section>

    <!-- a game section with three buttons - rock paper scissors -->
     <!-- each calling playRound() and two images of player and computer-->
    <section id="gameSection">
      <div class="choices">
        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>
      </div>
      <div class="arena">
        <figure>
          <figcaption>You</figcaption>
          <img id="playerImg" alt="Player" src="player.png">
        </figure>
        <span class="vs">VS</span>
        <figure>
          <figcaption>Computer</figcaption>
          <img id="computerImg" alt="Computer" src="computer.png">
        </figure>
      </div>
    </section>

    <!-- a result section with id result and a scoreboard showing wins,losses and draws -->
    <section id="resultSection">
      <p id="result"></p>
      <p class="score">
        Wins: <span id="wins">0</span>
        Losses: <span id="losses">0</span>
        Draws: <span id="draws">0</span>
      </p>
    </section>

    <!-- a history section with a table id history -->
    <!-- whose header row is Round, You, Computer, Result-->
    <section id="historySection">
      <h2>History</h2>
      <table id="history">
        <thead>
          <tr><th>Round</th><th>You</th><th>Computer</th><th>Result</th></tr>
        </thead>
      </table>

      <!--a Show Summary button, a Reset button-->
      <p id="summary"></p>
      <button onclick="showSummary()">Show Summary</button>
      <button onclick="resetGame()">Reset</button>
    </section>
  </main>

  <!-- footer with startTime and copyright -->
  <footer>
    <p id="startTime"></p>
    <p>&copy; 2026 Computer Science Club</p>
  </footer>

  <!-- Link the external JavaScript file just before the closing body tag -->
  <script src="game.js"></script>
</body>
</html>
